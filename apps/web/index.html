<!doctype html>
<html lang="es" data-skin="kamon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1916" />
    <meta name="description" content="One Shoot — estudio de ensayo de covers de K-pop: espejo, velocidad y clips en bucle." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="One Shoot" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights the UI uses: display 700/800 (font-bold/extrabold), sans 400/500/700, mono 500/600. -->
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!--
      The UI's kanji (札 舞 稽古帳 書庫 帖) as one ~4 KB Shippori Mincho file per weight. Loaded after the
      main sheet, so for these characters its faces win over the large Japanese unicode-range slices, which are
      then never downloaded; Latin keeps coming from the main sheet. Add any new UI kanji to `text=`.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&display=swap&text=%E6%9C%AD%E8%88%9E%E7%A8%BD%E5%8F%A4%E5%B8%B3%E6%9B%B8%E5%BA%AB%E5%B8%96"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <title>One Shoot</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
