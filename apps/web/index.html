<!doctype html>
<html lang="es" data-skin="kamon">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#1b1916" />
    <meta name="description" content="One Shoot — estudio de ensayo de covers de K-pop: espejo, velocidad y clips en bucle." />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="One Shoot" />
    <!--
      REQ-07 · Fonts are self-hosted (src/fonts.css): no third-party stylesheet blocks the first paint. Only the two
      faces the first screen needs are preloaded; the rest are fetched when a text uses them. REQ-05 · The preconnect
      to Supabase is injected at build time by vite.config.ts (omitted when VITE_SUPABASE_URL is not set).
      The UI's kanji (札 舞 稽古帳 書庫 帖 …) live in two small Shippori Mincho files (700/800) declared last in
      src/fonts.css, so for these characters they win over the large Japanese slices, which are then never downloaded.
      To add a UI kanji, follow the steps in the header comment of src/fonts.css (current set, for reference:
      札舞稽古帳書庫帖青海波判子円相試作演座員質寸齣式画眼音声格水報録設定面手元撮全楽菱比灯簾屏註拍御神籤福引曲人袋外記番次間紙芝居終願票当選決今日祭暦目).
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/src/assets/fonts/zen-kaku-gothic-new-400-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/src/assets/fonts/shippori-mincho-b1-700-latin.woff2"
      crossorigin
    />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <title>One Shoot</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- REQ-10 · Preloads the featured thumbnail on repeat visits (reads localStorage; no inline script). -->
    <script src="/lcp-preload.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
